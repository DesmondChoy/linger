[project]
name = "linger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.10",
    "fastapi>=0.141.1",
    "logfire[fastapi]>=4.40.0",
    "fastembed>=0.8.0",
    "numpy>=2.0.0",
    "polars>=1.43.2",
    "pydantic>=2.0.0",
    "pydantic-ai>=2.26.0",
    "pydantic-ai-harness[exa]>=0.18.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.0.0",
    "jupyterlab>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.logfire]
# Modules that create spans are importable without the FastAPI entry point that
# calls `configure_telemetry()` (tests, scripts). Spans are simply dropped there,
# which is correct; the warning about it is noise.
ignore_no_config = true
