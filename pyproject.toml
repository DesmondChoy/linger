[project]
name = "linger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "polars>=1.43.2",
    "pydantic-ai>=2.26.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
