name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No floating major tag is published for setup-uv.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      # Import-time model construction needs these; conftest.py blocks provider requests.
      - name: Configure offline settings
        run: |
          printf '%s\n' \
            'LINGER_MODEL=openai:gpt-5.6-luna' \
            'OPENAI_API_KEY=ci-offline-placeholder' > .env

      - name: Cache fastembed models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('apps/backend/hybrid_librarian.py') }}
          restore-keys: fastembed-${{ runner.os }}-

      - name: Run pytest
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
        run: uv run pytest

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test

      - name: Test Ground truth reviewer
        run: pnpm --dir ../../.agents/skills/review-synthetic-ground-truth/ui test
