6.0" y="344.6" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Searches books, memories, web</text><text x="526.0" y="361.1" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Does not rank or pick a winner</text><text x="526.0" y="377.6" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Returns SourceBundle</text><text x="526.0" y="394.1" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">or ConnectionDecline</text><polyline points="526.0,442.0 526.0,448.0" fill="none" stroke="#1f1f1f" stroke-width="1.4"/><polyline points="526.0,476.0 526.0,500.0" fill="none" stroke="#1f1f1f" stroke-width="1.4"/><polyline points="858.0,176.0 858.0,218.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><rect x="708.0" y="220.0" width="300.0" height="222.0" rx="6" fill="#e4e4e4" stroke="#1f1f1f" stroke-width="1.4"/><text x="858.0" y="284.5" font-size="14.5" font-weight="650" fill="#1f1f1f" text-anchor="middle">memory-recall</text><text x="858.0" y="303.3" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Intent: recall_memory</text><text x="858.0" y="319.8" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Searches memories only</text><text x="858.0" y="336.3" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Finds the user&#x27;s own</text><text x="858.0" y="352.8" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">earlier words on the topic</text><text x="858.0" y="369.3" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">Returns MemoryRecall</text><text x="858.0" y="385.8" font-size="12.5" font-weight="400" fill="#444" text-anchor="middle">or ConnectionDecline</text><polyline points="858.0,442.0 858.0,448.0" fill="none" stroke="#1f1f1f" stroke-width="1.4"/><polyline points="858.0,476.0 858.0,500.0" fill="none" stroke="#1f1f1f" stroke-width="1.4"/><polyline points="194.0,500.0 858.0,500.0" fill="n