<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 0 1300 440" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arr-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4442c"/></marker><marker id="arr-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker></defs><rect width="1300" height="440" fill="#ffffff"/><text x="480.0" y="44.0" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">Provenance passed it</text><text x="996.0" y="44.0" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">Provenance sent it back</text><text x="30.0" y="122.0" font-size="12.5" font-weight="400" fill="#5a5a5a" text-anchor="start">Muse&#x27;s draft</text><text x="30.0" y="144.0" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="start">was right</text><text x="30.0" y="270.0" font-size="12.5" font-weight="400" fill="#5a5a5a" text-anchor="start">Muse&#x27;s draft</text><text x="30.0" y="292.0" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="start">was wrong</text><rect x="230.0" y="60.0" width="500.0" height="132.0" rx="8" fill="#f4f3f0" stroke="none" stroke-width="1"/><text x="254.0" y="96.0" font-size="17" font-weight="700" fill="#555555" text-anchor="start">Correct pass</text><text x="254.0" y="126.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Test suite: passed 0.88 of safe drafts</text><rect x="746.0" y="60.0" width="500.0" height="132.0" rx="8" fill="#fcefe0" stroke="#d9822b" stroke-width="2"/><text x="770.0" y="96.0" font-size="17" font-weight="700" fill="#b15d12" text-anchor="start">Over-refusal</text><text x="770.0" y="126.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Test suite: sent back 0.12 of safe drafts</text><text x="770.0" y="148.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Final run: refused a correct question</text><rect x="230.0" y="208.0" width="500.0" height="132.0" rx="8" fill="#fbe4e2" stroke="#c0392b" stroke-width="2"/><text x="254.0" y="244.0" font-size="17" font-weight="700" fill="#a52a1e" text-anchor="start">Missed error</text><text x="254.0" y="274.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Test suite: passed 0.06 of unsafe drafts</text><text x="254.0" y="296.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Final run: “the Dodo takes the thimble”</text><rect x="746.0" y="208.0" width="500.0" height="132.0" rx="8" fill="#f4f3f0" stroke="none" stroke-width="1"/><text x="770.0" y="244.0" font-size="17" font-weight="700" fill="#555555" text-anchor="start">Correct catch</text><text x="770.0" y="274.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Test suite: blocked 0.94 of unsafe drafts</text><text x="770.0" y="296.0" font-size="13.5" font-weight="400" fill="#2a2a2a" text-anchor="start">Example: an unsupported claim (Figure 3.6)</text><polyline points="1248.0,126.0 1280.0,126.0 1280.0,366.0 480.0,366.0 480.0,343.0" fill="none" stroke="#b4442c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-sec)"/><text x="496.0" y="392.0" font-size="13.5" font-weight="650" fill="#b4442c" text-anchor="start">Added error: the first review flags a correct draft, Muse&#x27;s revision introduces the error,</text><text x="496.0" y="412.0" font-size="13.5" font-weight="400" fill="#b4442c" text-anchor="start">and the second review passes it (development run: a Pinocchio line given to Lamp-Wick).</text></svg>
