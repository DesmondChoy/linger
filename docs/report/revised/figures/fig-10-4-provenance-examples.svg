<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arr-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4442c"/></marker><marker id="arr-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2a"/></marker></defs><rect width="1400" height="560" fill="#ffffff"/><text x="210.0" y="32.0" font-size="14" font-weight="650" fill="#666666" text-anchor="start">Source</text><text x="520.0" y="32.0" font-size="14" font-weight="650" fill="#666666" text-anchor="start">Muse&#x27;s draft</text><text x="830.0" y="32.0" font-size="14" font-weight="650" fill="#666666" text-anchor="start">Provenance</text><text x="1120.0" y="32.0" font-size="14" font-weight="650" fill="#666666" text-anchor="start">What the reader got</text><line x1="20" y1="46" x2="1380" y2="46" stroke="#cccccc" stroke-width="1.2"/><text x="24.0" y="133.0" font-size="17" font-weight="700" fill="#a52a1e" text-anchor="start">Missed error</text><text x="24.0" y="154.0" font-size="12.5" font-weight="400" fill="#5a5a5a" text-anchor="start">Final run</text><rect x="210.0" y="64.0" width="270.0" height="124.0" rx="6" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/><text x="226.0" y="88.0" font-size="12" font-weight="400" fill="#777777" text-anchor="start" font-style="italic">Alice&#x27;s Adventures in Wonderland</text><text x="226.0" y="114.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">“Hand it over here,”</text><text x="226.0" y="135.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">said the Dodo.</text><rect x="520.0" y="64.0" width="270.0" height="124.0" rx="6" fill="#fbe4e2" stroke="#c0392b" stroke-width="1.4"/><text x="536.0" y="98.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">“The Dodo takes the</text><text x="536.0" y="120.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">thimble from her pocket.”</text><rect x="536.0" y="150.0" width="64.0" height="24.0" rx="12" fill="#c0392b" stroke="none" stroke-width="1.4"/><text x="568.0" y="166.5" font-size="12" font-weight="650" fill="#ffffff" text-anchor="middle">Wrong</text><rect x="830.0" y="64.0" width="250.0" height="124.0" rx="6" fill="#f2f1ee" stroke="#1f1f1f" stroke-width="1.4"/><text x="955.0" y="131.0" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Passed it</text><rect x="1120.0" y="64.0" width="250.0" height="124.0" rx="6" fill="#fbe4e2" stroke="none" stroke-width="1.4"/><text x="1138.0" y="122.0" font-size="14.5" font-weight="700" fill="#a52a1e" text-anchor="start">A wrong detail</text><text x="1138.0" y="144.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">in the reply</text><polyline points="484.0,126.0 516.0,126.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="794.0,126.0 826.0,126.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="1084.0,126.0 1116.0,126.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="24.0" y="299.0" font-size="17" font-weight="700" fill="#a52a1e" text-anchor="start">Added error</text><text x="24.0" y="320.0" font-size="12.5" font-weight="400" fill="#5a5a5a" text-anchor="start">Development run</text><rect x="210.0" y="230.0" width="270.0" height="124.0" rx="6" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/><text x="226.0" y="254.0" font-size="12" font-weight="400" fill="#777777" text-anchor="start" font-style="italic">The Adventures of Pinocchio</text><text x="226.0" y="280.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">Pinocchio: “one hour more</text><text x="226.0" y="301.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">or less makes very little</text><text x="226.0" y="322.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">difference.”</text><rect x="520.0" y="230.0" width="270.0" height="124.0" rx="6" fill="#e8f3ea" stroke="#3d8a52" stroke-width="1.4"/><text x="536.0" y="264.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">Gives the line</text><text x="536.0" y="286.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">to Pinocchio</text><rect x="536.0" y="316.0" width="64.0" height="24.0" rx="12" fill="#2f7a46" stroke="none" stroke-width="1.4"/><text x="568.0" y="332.5" font-size="12" font-weight="650" fill="#ffffff" text-anchor="middle">Right</text><rect x="830.0" y="230.0" width="250.0" height="124.0" rx="6" fill="#f2f1ee" stroke="#1f1f1f" stroke-width="1.4"/><text x="955.0" y="265.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Flagged the speaker;</text><text x="955.0" y="286.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Muse&#x27;s revision gave the</text><text x="955.0" y="307.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">line to Lamp-Wick; the</text><text x="955.0" y="328.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">second review passed it</text><rect x="1120.0" y="230.0" width="250.0" height="124.0" rx="6" fill="#fbe4e2" stroke="none" stroke-width="1.4"/><text x="1138.0" y="288.0" font-size="14.5" font-weight="700" fill="#a52a1e" text-anchor="start">A wrong speaker</text><text x="1138.0" y="310.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">in the reply</text><polyline points="484.0,292.0 516.0,292.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="794.0,292.0 826.0,292.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="1084.0,292.0 1116.0,292.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="24.0" y="465.0" font-size="17" font-weight="700" fill="#b15d12" text-anchor="start">Over-refusal</text><text x="24.0" y="486.0" font-size="12.5" font-weight="400" fill="#5a5a5a" text-anchor="start">Final run</text><rect x="210.0" y="396.0" width="270.0" height="124.0" rx="6" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/><text x="226.0" y="420.0" font-size="12" font-weight="400" fill="#777777" text-anchor="start" font-style="italic">Reader&#x27;s message</text><text x="226.0" y="446.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">“…finished two days before</text><text x="226.0" y="467.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">the assembly. Which day</text><text x="226.0" y="488.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">does that make my deadline?”</text><rect x="520.0" y="396.0" width="270.0" height="124.0" rx="6" fill="#e8f3ea" stroke="#3d8a52" stroke-width="1.4"/><text x="536.0" y="430.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">“What day is</text><text x="536.0" y="452.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">the assembly?”</text><rect x="536.0" y="482.0" width="64.0" height="24.0" rx="12" fill="#2f7a46" stroke="none" stroke-width="1.4"/><text x="568.0" y="498.5" font-size="12" font-weight="650" fill="#ffffff" text-anchor="middle">Right</text><rect x="830.0" y="396.0" width="250.0" height="124.0" rx="6" fill="#f2f1ee" stroke="#1f1f1f" stroke-width="1.4"/><text x="955.0" y="452.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Sent it back</text><text x="955.0" y="473.5" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">as out of scope</text><rect x="1120.0" y="396.0" width="250.0" height="124.0" rx="6" fill="#fcefe0" stroke="none" stroke-width="1.4"/><text x="1138.0" y="454.0" font-size="14.5" font-weight="700" fill="#b15d12" text-anchor="start">A refusal instead</text><text x="1138.0" y="476.0" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="start">of the question</text><polyline points="484.0,458.0 516.0,458.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="794.0,458.0 826.0,458.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><polyline points="1084.0,458.0 1116.0,458.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/></svg>
