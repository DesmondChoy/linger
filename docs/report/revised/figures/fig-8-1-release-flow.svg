xt><polyline points="328.0,290.0 252.0,290.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="290.0" y="282.0" font-size="12" font-weight="650" fill="#2f6b3a" text-anchor="middle">clear</text><rect x="30.0" y="410.0" width="220.0" height="60.0" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.4"/><text x="140.0" y="444.2" font-size="13.5" font-weight="650" fill="#1f1f1f" text-anchor="middle">Automatic approval</text><polyline points="140.0,342.0 140.0,408.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="148.0" y="380.0" font-size="12" font-weight="650" fill="#2f6b3a" text-anchor="start">yes</text><rect x="330.0" y="410.0" width="250.0" height="60.0" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.4"/><text x="455.0" y="444.2" font-size="13.5" font-weight="650" fill="#1f1f1f" text-anchor="middle">Human approval</text><polyline points="252.0,322.0 290.0,322.0 290.0,440.0 328.0,440.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="298.0" y="392.0" font-size="12" font-weight="650" fill="#2f6b3a" text-anchor="start">no</text><polyline points="1055.0,342.0 1055.0,380.0 455.0,380.0 455.0,408.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="1045.0" y="372.0" font-size="12" font-weight="650" fill="#555555" text-anchor="end">off: human approval required, no score</text><rect x="660.0" y="410.0" width="140.0" height="60.0" rx="6" fill="#b23a2a" stroke="#b23a2a" stroke-width="1.4"/><text x="730.0" y="444.2" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="middle">STOP</text><polyline points="582.0,440.0 658.0,440.0" fill="none" stroke="#b23a2a" stroke-width="1.4" marker-end="url(#arr-stop)"/><text x="620.0" y="432.0" font-size="11.5" font-weight="650" fill="#b23a2a" text-anchor="middle">rejected</text><rect x="30.0" y="550.0" width="250.0" height="66.0" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-wi