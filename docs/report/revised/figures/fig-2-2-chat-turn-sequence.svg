text x="818.0" y="53.3" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Muse</text><line x1="818" y1="80" x2="818" y2="945" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="959.0" y="20.0" width="190.0" height="58.0" rx="6" fill="#e4e4e4" stroke="#1f1f1f" stroke-width="1.4"/><text x="1054.0" y="44.8" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Librarian /</text><text x="1054.0" y="61.9" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Serendipity</text><line x1="1054" y1="80" x2="1054" y2="945" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="1195.0" y="20.0" width="190.0" height="58.0" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.4"/><text x="1290.0" y="44.8" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Memory and</text><text x="1290.0" y="61.9" font-size="14" font-weight="650" fill="#1f1f1f" text-anchor="middle">Policy Service</text><line x1="1290" y1="80" x2="1290" y2="945" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 5"/><polyline points="116.0,125.0 340.0,125.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="228.0" y="116.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">1  Line (reader message)</text><rect x="337.0" y="162.0" width="18.0" height="40.0" rx="2" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.4"/><text x="366.0" y="178.0" font-size="13.5" font-weight="700" fill="#1f1f1f" text-anchor="start">2  Pre-model checks (Figure 3.8, checks 1–6)</text><text x="366.0" y="196.0" font-size="12" font-weight="400" fill="#5a5a5a" text-anchor="start" font-style="italic">may end the turn with a fixed reply</text><polyline points="352.0,248.0 576.0,248.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="464.0" y="239.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">3  Emotional preflight, no tools</text><polyline points="576.0,298.0 352.0,298.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="464.0" y="272.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">continue_reflection |</text><text x="464.0" y="289.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">apply_boundary</text><polyline points="352.0,348.0 812.0,348.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="582.0" y="339.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">4  Triage, then tool grants</text><polyline points="812.0,398.0 352.0,398.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="582.0" y="389.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">5a  Muse requests a granted tool</text><polyline points="352.0,448.0 1048.0,448.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="700.0" y="439.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">5b  Application supplies the reader&#x27;s words and permitted scope</text><polyline points="1048.0,498.0 352.0,498.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="700.0" y="489.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">5c  Typed evidence or typed decline</text><polyline points="352.0,548.0 812.0,548.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="582.0" y="539.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">5d  Application returns the tool result</text><polyline points="812.0,598.0 352.0,598.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="582.0" y="589.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">6  Typed candidate with evidence declarations</text><polyline points="352.0,648.0 576.0,648.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="464.0" y="639.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">7  Candidate review, fresh context</text><polyline points="576.0,698.0 352.0,698.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="464.0" y="672.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">pass | revise (once,</text><text x="464.0" y="689.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">back to 5a) | reject</text><rect x="337.0" y="736.0" width="18.0" height="40.0" rx="2" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.4"/><text x="366.0" y="752.0" font-size="13.5" font-weight="700" fill="#1f1f1f" text-anchor="start">8  Deterministic release checks</text><text x="366.0" y="770.0" font-size="12" font-weight="400" fill="#5a5a5a" text-anchor="start" font-style="italic">quotations, citations and reading scope checked against evidence</text><polyline points="352.0,828.0 1284.0,828.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#arr-ink)"/><text x="818.0" y="819.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">9  Commit nomination, if review and policy allow</text><polyline points="340.0,888.0 116.0,888.0" fill="none" stroke="#1f1f1f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr-ink)"/><text x="228.0" y="862.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">10  Released reply,</text><text x="228.0" y="879.0" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="middle">clarification, or fixed reply</text><rect x="30.0" y="972.0" width="26.0" height="16.0" rx="4" fill="#e4e4e4" stroke="#1f1f1f" stroke-width="1.3"/><text x="64.0" y="984.5" font-size="12" font-weight="400" fill="#333333" text-anchor="start">model-backed agent</text><rect x=