<text x="495.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Sculptor&#x27;s proposal and exact sources:</text>
