<text x="36" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111">Receives the Props, placed in the account, and the Lines.</text>
<text x="36" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111">Never sees the Backstory or the Ground truth.</text>
