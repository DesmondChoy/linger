<text x="834" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#111">4  Replay</text>
<text x="834" y="109" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#333">Application</text>
