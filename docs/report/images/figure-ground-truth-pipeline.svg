<text x="564.0" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111">Receives the adopted Ground truth and the</text>
<text x="564.0" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111">system’s outputs. Hard gates are deterministic.</text>
